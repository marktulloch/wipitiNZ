<title>WIPITI | Aerospace & Autonomous Systems</title>
<style>
*{box-sizing:border-box}
html{background:#000;color:#fff}
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif}
main{width:min(100% - 40px,840px);text-align:center;padding:64px 0}
.brand{display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,45px);margin:0 auto 34px}
.mark{width:clamp(76px,14vw,140px);height:auto;flex:none}
.wordmark{font-size:clamp(2.4rem,8vw,6rem);font-weight:750;letter-spacing:.19em;line-height:1;margin-right:-.19em}
.subtitle{font-size:clamp(.65rem,1.6vw,.88rem);font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#b7b7b7}
.contact{display:inline-flex;align-items:center;justify-content:center;margin-top:38px;color:#b7b7b7;text-decoration:none;transition:color .2s ease}.contact:hover,.contact:focus-visible{color:#fff}.contact svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:560px){.brand{gap:18px}.mark{width:72px}.wordmark{font-size:clamp(1.9rem,9vw,3.4rem);letter-spacing:.12em;margin-right:-.12em}.subtitle{letter-spacing:.16em}.contact{margin-top:32px}}
</style>
</head>
<body>
<main>
<div class="brand" aria-label="WIPITI">
<svg class="mark" viewBox="440 85 238 158" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WIPITI emblem">

</svg>

</div>
<div class="subtitle">Aerospace &amp; Autonomous Systems</div>

</main>
</body>
</html>
